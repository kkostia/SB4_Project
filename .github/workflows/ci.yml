name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'sudoku-pwa/package-lock.json'

    - name: Install dependencies
      run: npm ci
      working-directory: sudoku-pwa

    - name: Run tests
      run: npm test -- --coverage --watchAll=false
      working-directory: sudoku-pwa

    - name: Build
      run: npm run build
      working-directory: sudoku-pwa

  deploy:
    name: Deploy to Firebase
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'sudoku-pwa/package-lock.json'
      - run: npm ci
        working-directory: sudoku-pwa
      - run: npm run build
        working-directory: sudoku-pwa
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SB4_SUDOKU_PWA }}'
          projectId: sb4-sudoku-pwa
          channelId: live

