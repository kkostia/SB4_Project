name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm install
      working-directory: sudoku-pwa

    - name: Run tests
      run: npm test -- --coverage --watchAll=false
      working-directory: sudoku-pwa

    - name: Build
      run: npm run build
      working-directory: sudoku-pwa
